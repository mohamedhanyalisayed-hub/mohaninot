<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="file2.css">
    <title>Document</title>
</head>
<body>
    <div class="curd">
        <div class="head">
            <h1>curds</h1>
            <p>product mangement system</p>
        </div>
        <div class="input">
            <input type="text" id="title" placeholder="title">
            <div class="mo">
                <input onkeyup="calculatetotalprice()" type="number" placeholder="price" id="price">   
                <input onkeyup="calculatetotalprice()" type="number" placeholder="taxes" id="taxes">
                <input onkeyup="calculatetotalprice()" type="number" placeholder="ads" id="ads">   
                <input onkeyup="calculatetotalprice()" type="number" placeholder="discount" id="discount">
                <small id="total"></small>  
            </div>
            <input type="number" placeholder="count" id="count">
            <input type="text" placeholder="category" id="category">
            <button id="btn">create</button>
        </div>
        
        <div class="output">
            <div class="out">    
                <input type="text" id="search" placeholder="search" onkeyup="searchdata(this.value)">
                <div class="two">
                    <button id="searchbycategory" onclick="getsearchmod(this.id)">searchbycategory</button>
                    <button id="searchbyitem" onclick="getsearchmod(this.id)">searchbyitem</button>   
                </div>
                <div id="deleteall"></div>        
                
                <table>
                    <tr>
                        <th>id</th>
                        <th>title</th>
                        <th>taxes</th>
                        <th>price</th>
                        <th>ads</th>
                        <th>discount</th>
                        <th>total</th>
                        <th>category</th>
                        <th>update</th>
                        <th>delete</th>
                    </tr>
                    <tbody id="tbody">
                        <!-- صف تجريبي واحد لتتأكد من شكل الجدول -->
                        <tr>
                            <td>1</td>
                            <td>Samsung S23</td>
                            <td>100</td>
                            <td>20000</td>
                            <td>50</td>
                            <td>10</td>
                            <td>20140</td>
                            <td>Phone</td>
                            <td><button id="update">update</button></td>
                            <td><button id="delete">delete</button></td>
                        </tr>
                    </tbody>  
                </table>
            </div>
        </div>
    </div> 
    <script src="file3.js"></script>   
</body>
</html>
